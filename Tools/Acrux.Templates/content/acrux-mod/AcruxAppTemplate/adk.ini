[generators]
; Only what a UI app needs. Turn on other ADK generators (network, modules, singleton, chat, api,
; terminal-controls, constants, client-server-boundary, mdk-pack-test) when the mod uses them.
all = false

; Acrux.Generator: XAML views and runtime type tables.
gui = true
; Acrux.Generator: <Vm>Preview design data from [PreviewWith] (design-only, MDK does not pack it).
preview-clones = true
; Adk.Analyzer: [ObservableProperty] fields become notifying properties.
observable-properties = true
