; This file is project specific and should be checked in to source control.

[mdk]
; This is a mod project.
type=mod

; Toggle trace (on|off) (verbose output)
trace=off

; Files MDK does not pack. *.AcruxDesign.cs (hand-written design data) and *.AcruxDesign.g.cs (the generated
; <Vm>Preview clones) are design-only: the Acrux/ADK generators read this list to tell design code apart.
ignores=obj/**/*,bin/**/*,MDK/**/*,adk.ini,Scripts/**/*.axaml,Scripts/**/*.xaml,**/*.AcruxDesign.cs,**/*.AcruxDesign.g.cs

; Files and folders not cleaned from the output folder.
donotclean=metadata.mod,modinfo.sbmi
